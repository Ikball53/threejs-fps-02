<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Yard — Tactical FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14161c;
    font-family: "Segoe UI", system-ui, sans-serif; color: #f2f0ea; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #app.hurt::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 90px 30px rgba(255, 40, 20, 0.55); }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .hidden { display: none !important; }

  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 8px; }
  #crosshair .ch { position: absolute; background: #ffe9a8; box-shadow: 0 0 3px #000; }
  #crosshair .t { left: -1px; top: calc(-1 * var(--gap) - 9px); width: 2px; height: 9px; }
  #crosshair .b { left: -1px; top: var(--gap); width: 2px; height: 9px; }
  #crosshair .l { top: -1px; left: calc(-1 * var(--gap) - 9px); width: 9px; height: 2px; }
  #crosshair .r { top: -1px; left: var(--gap); width: 9px; height: 2px; }
  #crosshair .dot { left: -1.5px; top: -1.5px; width: 3px; height: 3px; border-radius: 50%; }
  #hitmark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 26px; font-weight: 900; color: #fff; opacity: 0; text-shadow: 0 0 6px #000; }

  #topbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; }
  #timer { font-size: 30px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 2px 6px #000; }
  #score { font-size: 14px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 4px #000; margin-top: 2px; }
  #score .you { color: #7fd67a; } #score .foe { color: #ff7a5a; } #score .mid { color: #ccc; margin: 0 8px; }
  #bombstat { font-size: 15px; font-weight: 800; letter-spacing: 1px; margin-top: 4px; text-shadow: 0 1px 4px #000; }

  #health { position: absolute; left: 22px; bottom: 20px; width: 240px; }
  #hpbar { height: 14px; width: 100%; background: #7fd67a; border: 1px solid #000; }
  #hptext { font-size: 20px; font-weight: 800; text-shadow: 0 1px 4px #000; }
  #armortext { font-size: 14px; font-weight: 700; color: #8fc7ff; text-shadow: 0 1px 4px #000; }
  #ammo { position: absolute; right: 26px; bottom: 18px; text-align: right; text-shadow: 0 1px 4px #000; }
  #ammomag { font-size: 40px; font-weight: 900; } #ammores { font-size: 20px; color: #ccc; }
  #wname { font-size: 14px; font-weight: 700; color: #ffd27a; letter-spacing: 1px; }
  #money { position: absolute; right: 26px; bottom: 96px; font-size: 22px; font-weight: 800;
    color: #8fe388; text-shadow: 0 1px 4px #000; }
  #feed { position: absolute; right: 26px; top: 90px; text-align: right; font-size: 13px; font-weight: 600; }
  #feed div { margin-top: 4px; text-shadow: 0 1px 3px #000; color: #ffe9a8; }
  #banner { position: absolute; left: 50%; top: 26%; transform: translateX(-50%);
    font-size: 30px; font-weight: 900; letter-spacing: 2px; text-align: center;
    text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
  #banner.good { color: #8fe388; } #banner.bad { color: #ff6a4d; }
  #plantbar { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
    width: 300px; height: 16px; border: 1px solid #fff; background: rgba(0,0,0,0.5); display: none; }
  #plantfill { height: 100%; width: 0; background: #ffb13c; }
  #plantlabel { position: absolute; left: 50%; transform: translateX(-50%); top: -22px;
    font-size: 13px; font-weight: 800; letter-spacing: 1px; white-space: nowrap; }
  #hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.55); letter-spacing: 0.5px; white-space: nowrap; }

  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(12, 13, 18, 0.72); pointer-events: auto; text-align: center; }
  #menu h1 { font-size: 64px; letter-spacing: 8px; color: #ffb13c; text-shadow: 0 4px 18px #000; }
  #menu .sub { font-size: 17px; margin: 12px 0 6px; max-width: 560px; line-height: 1.5; }
  #menu .ctl { font-size: 14px; color: #cfd2da; line-height: 1.9; margin: 10px 0 22px; }
  #playbtn { pointer-events: auto; cursor: pointer; font-size: 20px; font-weight: 800; letter-spacing: 2px;
    color: #14161c; background: #ffb13c; border: none; padding: 14px 42px; border-radius: 4px; }
  #playbtn:hover { background: #ffc861; }
  #menu .fine { font-size: 13px; color: #9aa0ad; margin-top: 18px; }

  #buy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 460px; background: rgba(14, 16, 22, 0.92); border: 1px solid #ffb13c;
    padding: 18px 22px; pointer-events: auto; }
  #buy h2 { font-size: 18px; letter-spacing: 1px; color: #ffb13c; margin-bottom: 12px; }
  .buyrow { display: flex; justify-content: space-between; gap: 10px; padding: 9px 10px;
    border: 1px solid #33363f; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
  .buyrow:hover { border-color: #ffb13c; background: rgba(255, 177, 60, 0.12); }
  .buyrow span { color: #8fe388; font-weight: 800; }
  .buyrow em { color: #9aa0ad; font-style: normal; }
  #buymoney { margin-top: 10px; font-size: 14px; font-weight: 700; color: #8fe388; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
